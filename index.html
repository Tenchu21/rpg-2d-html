<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <title>Dungeon of Ember</title>
  <style>
    :root { color-scheme: dark; --gold: #ffd166; --text: #f5f2e8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 20%, #26394d, #101827 68%, #090e17);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    /* Todo o HUD e os menus ficam ancorados dentro da área do jogo. */
    #gameWrap {
      position: relative;
      isolation: isolate;
      width: min(960px, 100vw, 177.78dvh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 2px solid rgba(255, 220, 145, .55);
      border-radius: 12px;
      background: #315d3b;
      box-shadow: 0 22px 80px #0009, 0 0 30px #ffd16620;
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #gameMenu {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      width: max-content;
      max-width: calc(100% - 20px);
      gap: 6px;
      padding: 6px;
      border: 1px solid #ffe1a070;
      border-radius: 14px;
      background: linear-gradient(180deg, #253044f5, #101827fa);
      box-shadow: 0 8px 26px #000b, inset 0 1px #ffffff20;
      backdrop-filter: blur(8px);
    }
    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 103px;
      min-height: 43px;
      padding: 7px 10px;
      border: 1px solid #ffffff1a;
      border-radius: 10px;
      background: #ffffff0b;
      color: var(--text);
      font: 700 13px/1 system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s, background .15s, border-color .15s;
    }
    .menu-button:hover, .menu-button[aria-expanded="true"], .menu-button.active {
      transform: translateY(-2px);
      border-color: #ffd166cc;
      background: #ffd16626;
      color: #ffe29a;
    }
    .menu-button:focus-visible, .panel-close:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .menu-icon { font-size: 18px; line-height: 1; }
    .menu-panel {
      position: absolute;
      z-index: 21;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      width: min(360px, calc(100% - 24px));
      padding: 18px 20px;
      border: 1px solid #ffd166a6;
      border-radius: 15px;
      background: rgba(15, 23, 42, .97);
      box-shadow: 0 14px 36px #000c;
      backdrop-filter: blur(10px);
    }
    .menu-panel[hidden] { display: none; }
    .menu-panel h2 { margin: 0 38px 13px 0; color: var(--gold); font-size: 19px; }
    .menu-panel p { margin: 8px 0; color: #f1eee5; font-size: 14px; line-height: 1.5; }
    .menu-panel .muted { color: #b7c1ce; }
    .panel-close { position: absolute; top: 10px; right: 10px; width: 31px; height: 31px; border: 1px solid #ffffff35; border-radius: 9px; background: #ffffff10; color: white; font-size: 20px; cursor: pointer; }
    @media (max-width: 620px) {
      #gameWrap { width: 100vw; border-radius: 0; border-left: 0; border-right: 0; }
      #gameMenu { width: calc(100% - 12px); max-width: none; gap: 3px; padding: 4px; bottom: max(7px, env(safe-area-inset-bottom)); }
      .menu-button { flex: 1; min-width: 0; min-height: 39px; gap: 3px; padding: 5px 2px; font-size: clamp(9px, 2.8vw, 12px); }
      .menu-icon { font-size: clamp(14px, 4vw, 17px); }
      .menu-panel { bottom: 61px; }
    }
    @media (max-height: 390px) {
      #gameMenu { bottom: 4px; }
      .menu-button { min-height: 34px; }
      .menu-panel { bottom: 52px; }
    }
  </style>
</head>
<body>
  <main id="gameWrap">
    <canvas id="game" width="960" height="540" aria-label="Jogo RPG 2D"></canvas>

    <nav id="gameMenu" aria-label="Menu do jogo">
      <button class="menu-button" type="button" data-panel="items" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">🎒</span><span>Itens</span></button>
      <button class="menu-button" type="button" data-panel="status" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">🛡️</span><span>Status</span></button>
      <button class="menu-button" type="button" data-panel="options" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">⚙️</span><span>Opções</span></button>
      <button class="menu-button" type="button" data-panel="talents" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">✨</span><span>Talentos</span></button>
      <button id="autoHuntButton" class="menu-button" type="button" aria-pressed="false"><span class="menu-icon" aria-hidden="true">🎯</span><span>Caça Auto</span></button>
    </nav>

    <section class="menu-panel" id="menuPanel" aria-live="polite" hidden>
      <button class="panel-close" type="button" aria-label="Fechar painel">×</button>
      <div id="panelContent"></div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const player = { x: 100, y: 120, size: 24, hp: 100, maxHp: 100, attack: 12, level: 1, xp: 0, toNext: 40, attackCooldown: 0 };
    const keys = Object.create(null);
    const items = ['Poção de vida'];
    let message = 'Explore a vila e encontre Mira!';
    const npc = { x: 760, y: 130 };
    const enemies = [
      { x: 680, y: 380, hp: 32, maxHp: 32, kind: 'Slime' },
      { x: 450, y: 420, hp: 32, maxHp: 32, kind: 'Slime' },
      { x: 290, y: 350, hp: 32, maxHp: 32, kind: 'Slime' }
    ];
    let crystals = 0;
    let questStarted = false;
    let questComplete = false;
    let lastFrame = 0;
    let autoHunt = false;
    let attackTimer = 0;

    function roundedRect(x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }
    function drawTree(x, y, scale = 1) {
      ctx.fillStyle = '#172d23aa'; ctx.beginPath(); ctx.ellipse(x + 4, y + 22, 27 * scale, 10 * scale, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#704629'; ctx.fillRect(x - 5 * scale, y, 10 * scale, 27 * scale);
      ctx.fillStyle = '#1e5639'; ctx.beginPath(); ctx.arc(x, y - 5 * scale, 23 * scale, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#34764a'; ctx.beginPath(); ctx.arc(x - 8 * scale, y - 13 * scale, 15 * scale, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#579154'; ctx.beginPath(); ctx.arc(x + 8 * scale, y - 10 * scale, 11 * scale, 0, Math.PI * 2); ctx.fill();
    }
    function drawPerson(x, y, color, name, isPlayer = false) {
      ctx.fillStyle = '#13251bb0'; ctx.beginPath(); ctx.ellipse(x + 13, y + 29, 17, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2c99a'; ctx.beginPath(); ctx.arc(x + 13, y + 2, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isPlayer ? '#243f86' : '#6a3e88'; ctx.fillRect(x + 5, y - 5, 16, 8);
      roundedRect(x + 3, y + 9, 20, 19, 5, color);
      ctx.fillStyle = '#e9c18c'; ctx.fillRect(x + 5, y + 27, 6, 8); ctx.fillRect(x + 16, y + 27, 6, 8);
      ctx.fillStyle = '#1b263b'; ctx.fillRect(x + 8, y + 1, 2, 2); ctx.fillRect(x + 16, y + 1, 2, 2);
      if (name) {
        ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
        roundedRect(x - 8, y - 28, 42, 18, 7, '#111827dd');
        ctx.fillStyle = '#fff0c2'; ctx.fillText(name, x + 13, y - 15); ctx.textAlign = 'left';
      }
    }
    function drawSlime(enemy) {
      ctx.fillStyle = '#17332190'; ctx.beginPath(); ctx.ellipse(enemy.x, enemy.y + 13, 20, 7, 0, 0, Math.PI * 2); ctx.fill();
      const gradient = ctx.createLinearGradient(enemy.x - 15, enemy.y - 15, enemy.x + 12, enemy.y + 14);
      gradient.addColorStop(0, '#b8ff9b'); gradient.addColorStop(1, '#3ba864');
      ctx.fillStyle = gradient; ctx.beginPath(); ctx.ellipse(enemy.x, enemy.y, 17, 14, 0, Math.PI, Math.PI * 2); ctx.lineTo(enemy.x + 17, enemy.y + 8); ctx.quadraticCurveTo(enemy.x, enemy.y + 20, enemy.x - 17, enemy.y + 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#18352a'; ctx.fillRect(enemy.x - 7, enemy.y + 1, 3, 4); ctx.fillRect(enemy.x + 5, enemy.y + 1, 3, 4);
      ctx.fillStyle = '#13231caa'; ctx.fillRect(enemy.x - 18, enemy.y - 23, 36, 5);
      ctx.fillStyle = '#ff6577'; ctx.fillRect(enemy.x - 17, enemy.y - 22, 34 * Math.max(0, enemy.hp) / enemy.maxHp, 3);
    }
    function draw() {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, '#57915b'); bg.addColorStop(.55, '#3d8050'); bg.addColorStop(1, '#285b42');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let x = 14; x < canvas.width; x += 37) for (let y = 16; y < canvas.height; y += 33) {
        ctx.fillStyle = (x * y) % 3 ? '#d9f3a51c' : '#173f321c'; ctx.fillRect(x, y, 3, 5);
      }
      ctx.fillStyle = '#a88352'; ctx.fillRect(0, 238, canvas.width, 48); ctx.fillRect(714, 0, 52, 286);
      ctx.fillStyle = '#c09a64'; ctx.fillRect(0, 238, canvas.width, 5); ctx.fillRect(714, 0, 5, 286);
      ctx.fillStyle = '#76553955';
      for (let x = 15; x < 950; x += 46) ctx.fillRect(x, 260 + (x % 3), 18, 3);
      drawTree(70, 95, 1.05); drawTree(172, 110, .78); drawTree(375, 92, .92); drawTree(570, 120, .82);
      drawTree(880, 105, 1); drawTree(910, 315, .8); drawTree(75, 390, .9); drawTree(835, 465, 1.1);
      for (const [x, y] of [[225, 180], [540, 325], [615, 175], [350, 470], [810, 330]]) {
        ctx.fillStyle = '#24392c66'; ctx.beginPath(); ctx.ellipse(x, y + 5, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#9bada0'; ctx.beginPath(); ctx.ellipse(x, y, 10, 7, -.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d5ddc8'; ctx.fillRect(x - 4, y - 3, 5, 2);
      }
      for (const [x, y] of [[255, 150], [330, 310], [610, 465], [865, 240], [500, 185], [130, 315]]) {
        ctx.fillStyle = '#f7d96b'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f4a8ba'; ctx.beginPath(); ctx.arc(x + 4, y + 2, 2, 0, Math.PI * 2); ctx.fill();
      }
      roundedRect(15, 15, 220, 66, 13, '#101a26e8');
      ctx.strokeStyle = '#ffe1a055'; ctx.lineWidth = 1; ctx.strokeRect(16, 16, 218, 64);
      ctx.fillStyle = '#fff0d4'; ctx.font = 'bold 14px system-ui'; ctx.fillText(`AVENTUREIRO  •  Nv. ${player.level}`, 27, 37);
      roundedRect(27, 47, 194, 12, 6, '#050b12');
      const hpGrad = ctx.createLinearGradient(27, 0, 221, 0); hpGrad.addColorStop(0, '#ee5b69'); hpGrad.addColorStop(1, '#ff9b63');
      roundedRect(29, 49, 190 * player.hp / player.maxHp, 8, 4, hpGrad);
      ctx.fillStyle = '#f9e9d1'; ctx.font = '11px system-ui'; ctx.fillText(`♥ ${player.hp} / ${player.maxHp}`, 28, 74);
      roundedRect(canvas.width - 222, 15, 207, 72, 12, '#101a26e8');
      ctx.strokeStyle = '#ffe1a055'; ctx.strokeRect(canvas.width - 221, 16, 205, 70);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 13px system-ui'; ctx.fillText('✦  MISSÃO DE MIRA', canvas.width - 207, 39);
      ctx.fillStyle = '#f4efe4'; ctx.font = '12px system-ui';
      ctx.fillText(questComplete ? 'Recompensa recebida!' : questStarted ? `Cristais: ${crystals} / 3` : 'Encontre Mira na trilha', canvas.width - 207, 62);
      for (const enemy of enemies) drawSlime(enemy);
      drawPerson(npc.x - 13, npc.y - 13, '#6aa6db', 'Mira');
      drawPerson(player.x, player.y, '#c75e55', 'Herói', true);
      roundedRect(250, canvas.height - 70, 460, 28, 9, '#101a26df');
      ctx.fillStyle = '#fff0d4'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText(message, 480, canvas.height - 51); ctx.textAlign = 'left';
      if (autoHunt) {
        roundedRect(760, canvas.height - 67, 150, 25, 8, '#ffd166');
        ctx.fillStyle = '#101827'; ctx.font = 'bold 12px system-ui'; ctx.fillText('🎯 CAÇA ATIVA', 780, canvas.height - 50);
      }
    }
    function getNearestEnemy() {
      let target = null; let nearestDistance = Infinity;
      for (const enemy of enemies) {
        const d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (d < nearestDistance) { nearestDistance = d; target = enemy; }
      }
      return target;
    }
    function attack() {
      if (player.attackCooldown > 0) return false;
      const target = getNearestEnemy();
      if (!target) { message = 'Não há inimigos na área.'; return false; }
      const distance = Math.hypot(player.x - target.x, player.y - target.y);
      if (distance > 42) return false;
      player.attackCooldown = .45;
      target.hp -= player.attack;
      if (target.hp <= 0) {
        enemies.splice(enemies.indexOf(target), 1);
        player.xp += 15;
        if (questStarted && crystals < 3) crystals++;
        if (player.xp >= player.toNext) {
          player.xp -= player.toNext; player.level++; player.attack += 4;
          player.maxHp += 12; player.hp = player.maxHp; player.toNext = Math.floor(player.toNext * 1.5);
        }
        message = `Você derrotou o ${target.kind}! +15 XP`;
      } else message = `Você acertou o ${target.kind}!`;
      return true;
    }
    function update(timestamp) {
      const dt = Math.min((timestamp - (lastFrame || timestamp)) / 1000, .04); lastFrame = timestamp;
      player.attackCooldown = Math.max(0, player.attackCooldown - dt);
      attackTimer -= dt;
      const speed = 190 * dt;
      if (!autoHunt) {
        if (keys.ArrowUp || keys.KeyW) player.y -= speed;
        if (keys.ArrowDown || keys.KeyS) player.y += speed;
        if (keys.ArrowLeft || keys.KeyA) player.x -= speed;
        if (keys.ArrowRight || keys.KeyD) player.x += speed;
      } else {
        const target = getNearestEnemy();
        if (target) {
          const dx = target.x - player.x; const dy = target.y - player.y; const dist = Math.hypot(dx, dy);
          if (dist > 34) { player.x += dx / dist * 125 * dt; player.y += dy / dist * 125 * dt; }
          else if (attackTimer <= 0) { attack(); attackTimer = .48; }
        }
      }
      player.x = Math.max(28, Math.min(canvas.width - player.size - 28, player.x));
      player.y = Math.max(100, Math.min(canvas.height - player.size - 88, player.y));
      draw(); requestAnimationFrame(update);
    }
    function interact() {
      if (Math.hypot(player.x - npc.x, player.y - npc.y) > 65) { message = 'Chegue mais perto de Mira para conversar.'; return; }
      if (!questStarted) { questStarted = true; message = 'Mira: Derrote 3 slimes para receber uma recompensa!'; }
      else if (crystals >= 3 && !questComplete) { questComplete = true; player.attack += 6; items.push('Lâmina do Fogo'); message = 'Missão concluída! Você ganhou a Lâmina do Fogo.'; }
      else if (questComplete) message = 'Mira: Obrigada pela ajuda, aventureiro!';
      else message = `Mira: Ainda faltam ${3 - crystals} cristais.`;
    }

    const menuPanel = document.getElementById('menuPanel');
    const panelContent = document.getElementById('panelContent');
    const menuButtons = [...document.querySelectorAll('.menu-button[data-panel]')];
    const autoHuntButton = document.getElementById('autoHuntButton');
    const panelMarkup = {
      items: () => `<h2>🎒 Itens</h2><p>${items.map(item => `🎁 ${item}`).join('<br>')}</p><p>💎 Cristais da missão: ${crystals}</p>`,
      status: () => `<h2>🛡️ Status</h2><p>Nível: ${player.level}</p><p>Vida: ${player.hp} / ${player.maxHp}</p><p>Ataque: ${player.attack}</p><p>Experiência: ${player.xp} / ${player.toNext}</p>`,
      options: () => `<h2>⚙️ Opções</h2><p>Use as setas ou WASD para andar.</p><p>Espaço: atacar • E: interagir com Mira.</p>`,
      talents: () => `<h2>✨ Talentos</h2><p>⭐ Nível do aventureiro: ${player.level}</p><p>⚔️ Poder de ataque: ${player.attack}</p><p class="muted">Derrote inimigos para ganhar experiência e subir de nível.</p>`
    };
    function closePanel() { menuPanel.hidden = true; menuButtons.forEach(button => button.setAttribute('aria-expanded', 'false')); }
    menuButtons.forEach(button => button.addEventListener('click', () => {
      if (!menuPanel.hidden && button.getAttribute('aria-expanded') === 'true') { closePanel(); return; }
      menuButtons.forEach(item => item.setAttribute('aria-expanded', 'false'));
      button.setAttribute('aria-expanded', 'true');
      panelContent.innerHTML = panelMarkup[button.dataset.panel]();
      menuPanel.hidden = false;
    }));
    autoHuntButton.addEventListener('click', () => {
      autoHunt = !autoHunt;
      autoHuntButton.classList.toggle('active', autoHunt);
      autoHuntButton.setAttribute('aria-pressed', String(autoHunt));
      message = autoHunt ? 'Caça automática ativada.' : 'Caça automática desativada.';
    });
    document.querySelector('.panel-close').addEventListener('click', closePanel);
    document.addEventListener('keydown', event => {
      if (event.code === 'Escape') closePanel();
      if (event.code === 'Space') { event.preventDefault(); attack(); }
      if (event.code === 'KeyE') interact();
      keys[event.code] = true;
    });
    document.addEventListener('keyup', event => { keys[event.code] = false; });
    draw(); requestAnimationFrame(update);
  </script>
</body>
</html>
