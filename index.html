<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeon of Ember</title>
  <style>
    :root { color-scheme: dark; --text: #e9eefc; --accent: #ffd166; --panel: rgba(12,18,35,.96); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0f1220; color: var(--text); font-family: Arial, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    #gameWrap { position: relative; width: min(960px, 100vw); height: min(540px, 100vh); overflow: hidden; border: 2px solid rgba(255,255,255,.2); background: #1e2b35; box-shadow: 0 0 40px #0008; }
    canvas { display: block; width: 100%; height: 100%; }
    .hint { position: absolute; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); padding: 8px 12px; border-radius: 8px; background: #080d1bcc; font-size: 12px; text-align: center; pointer-events: none; }

    /* A barra fica fixa à janela, fora da área de desenho do canvas. */
    .game-menu { position: fixed !important; z-index: 2147483000 !important; left: 50% !important; bottom: max(14px, env(safe-area-inset-bottom)) !important; transform: translateX(-50%) !important; display: flex !important; visibility: visible !important; opacity: 1 !important; gap: 8px; width: max-content; max-width: calc(100vw - 20px); padding: 8px; border: 1px solid #ffd16699; border-radius: 16px; background: rgba(12,18,35,.97); box-shadow: 0 8px 28px #0009; }
    .menu-button { min-width: 92px; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--text); font: 600 13px Arial,sans-serif; cursor: pointer; }
    .menu-button:hover, .menu-button[aria-expanded="true"] { background: #ffd16626; border-color: #ffd16680; color: var(--accent); }
    .menu-icon { display: block; margin-bottom: 4px; font-size: 18px; }
    .menu-panel { position: fixed !important; z-index: 2147483001 !important; left: 50% !important; bottom: 88px !important; transform: translateX(-50%) !important; width: min(340px, calc(100vw - 24px)); padding: 18px; border: 1px solid #ffd16680; border-radius: 14px; background: var(--panel); box-shadow: 0 12px 32px #000b; }
    .menu-panel[hidden] { display: none !important; }
    .menu-panel h2 { margin: 0 36px 12px 0; color: var(--accent); font-size: 18px; }
    .menu-panel p { margin: 8px 0; font-size: 14px; line-height: 1.45; }
    .menu-panel .muted { color: #aebbd2; }
    .panel-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 1px solid #ffffff44; border-radius: 8px; background: #ffffff10; color: var(--text); font-size: 18px; cursor: pointer; }
    @media (max-width: 500px) { .game-menu { gap: 2px; padding: 5px; width: calc(100vw - 16px); justify-content: space-around; } .menu-button { min-width: 0; flex: 1; padding: 7px 3px; font-size: 11px; } .menu-icon { font-size: 16px; } .menu-panel { bottom: 78px !important; } .hint { top: 6px; font-size: 10px; } }
  </style>
</head>
<body>
  <main id="gameWrap">
    <canvas id="game" width="960" height="540" aria-label="Jogo RPG 2D"></canvas>
    <div class="hint">WASD / Setas = mover • Espaço = atacar • E = interagir</div>
  </main>

  <nav class="game-menu" aria-label="Menu do jogo">
    <button class="menu-button" type="button" data-panel="items" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">🎒</span>Itens</button>
    <button class="menu-button" type="button" data-panel="status" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">🛡️</span>Status</button>
    <button class="menu-button" type="button" data-panel="options" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">⚙️</span>Opções</button>
    <button class="menu-button" type="button" data-panel="talents" aria-expanded="false" aria-controls="menuPanel"><span class="menu-icon" aria-hidden="true">✨</span>Talentos</button>
  </nav>
  <section class="menu-panel" id="menuPanel" aria-live="polite" hidden>
    <button class="panel-close" type="button" aria-label="Fechar painel">×</button>
    <div id="panelContent"></div>
  </section>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const player = { x: 100, y: 120, size: 24, hp: 100, maxHp: 100, attack: 12, level: 1, xp: 0 };
    const keys = Object.create(null);
    const items = ['Poção de vida'];
    let message = 'Explore a vila e encontre Mira!';
    const npc = { x: 760, y: 130 };
    const enemies = [
      { x: 680, y: 380, hp: 32, maxHp: 32, kind: 'Slime' },
      { x: 450, y: 420, hp: 32, maxHp: 32, kind: 'Slime' },
      { x: 290, y: 350, hp: 32, maxHp: 32, kind: 'Slime' }
    ];
    let crystals = 0;
    let questStarted = false;
    let questComplete = false;

    function draw() {
      ctx.fillStyle = '#3d8b59'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Grama e caminhos decorativos
      ctx.fillStyle = '#ffffff10';
      for (let x = 20; x < canvas.width; x += 48) for (let y = 20; y < canvas.height; y += 46) ctx.fillRect(x, y, 4, 4);
      ctx.fillStyle = '#947447'; ctx.fillRect(0, 235, canvas.width, 54); ctx.fillRect(705, 0, 55, 300);
      // NPC
      ctx.fillStyle = '#6db2ff'; ctx.fillRect(npc.x, npc.y, 26, 30); ctx.fillStyle = '#f4d6a0'; ctx.fillRect(npc.x + 7, npc.y - 9, 12, 12);
      ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.fillText('Mira', npc.x - 1, npc.y - 14);
      // Inimigos
      for (const enemy of enemies) {
        ctx.fillStyle = '#7ce38b'; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#381b28'; ctx.fillRect(enemy.x - 16, enemy.y - 24, 32, 5);
        ctx.fillStyle = '#ff4d4d'; ctx.fillRect(enemy.x - 16, enemy.y - 24, 32 * enemy.hp / enemy.maxHp, 5);
      }
      // Jogador
      ctx.fillStyle = '#1e3a8a'; ctx.fillRect(player.x + 5, player.y - 7, 14, 12);
      ctx.fillStyle = '#ffd166'; ctx.fillRect(player.x, player.y, player.size, player.size);
      // HUD
      ctx.fillStyle = '#0c1223dd'; ctx.fillRect(16, 16, 205, 56);
      ctx.fillStyle = '#7ae582'; ctx.fillRect(22, 23, 190 * player.hp / player.maxHp, 16);
      ctx.fillStyle = '#f2f5ff'; ctx.font = 'bold 14px Arial'; ctx.fillText(`HP ${player.hp}/${player.maxHp}  •  Nível ${player.level}`, 22, 59);
      ctx.fillStyle = '#0c1223dd'; ctx.fillRect(canvas.width - 225, 16, 210, 72);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 14px Arial'; ctx.fillText('MISSÃO', canvas.width - 210, 38);
      ctx.fillStyle = '#fff'; ctx.font = '13px Arial'; ctx.fillText(questComplete ? 'Concluída!' : questStarted ? `Cristais: ${crystals}/3` : 'Fale com Mira', canvas.width - 210, 60);
      ctx.fillStyle = '#0c1223dd'; ctx.fillRect(250, canvas.height - 46, 460, 28);
      ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.fillText(message, 264, canvas.height - 27);
    }

    function update() {
      const speed = 3;
      if (keys.ArrowUp || keys.KeyW) player.y -= speed;
      if (keys.ArrowDown || keys.KeyS) player.y += speed;
      if (keys.ArrowLeft || keys.KeyA) player.x -= speed;
      if (keys.ArrowRight || keys.KeyD) player.x += speed;
      player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
      draw();
      requestAnimationFrame(update);
    }

    function attack() {
      const target = enemies.find(enemy => Math.hypot(player.x - enemy.x, player.y - enemy.y) < 55);
      if (!target) { message = 'Nenhum inimigo próximo.'; return; }
      target.hp -= player.attack;
      if (target.hp <= 0) {
        enemies.splice(enemies.indexOf(target), 1);
        player.xp += 15;
        if (questStarted && crystals < 3) crystals++;
        if (player.xp >= 40) { player.xp -= 40; player.level++; player.attack += 4; player.maxHp += 12; player.hp = player.maxHp; }
        message = `Você derrotou o ${target.kind}! +15 XP`;
      } else message = `Você acertou o ${target.kind}!`;
    }

    function interact() {
      if (Math.hypot(player.x - npc.x, player.y - npc.y) > 60) { message = 'Chegue mais perto de Mira para conversar.'; return; }
      if (!questStarted) { questStarted = true; message = 'Mira: Derrote 3 slimes para receber uma recompensa!'; }
      else if (crystals >= 3 && !questComplete) { questComplete = true; player.attack += 6; items.push('Lâmina do Fogo'); message = 'Missão concluída! Você ganhou a Lâmina do Fogo.'; }
      else if (questComplete) message = 'Mira: Obrigada pela ajuda, aventureiro!';
      else message = `Mira: Ainda faltam ${3 - crystals} cristais.`;
    }

    const menuPanel = document.getElementById('menuPanel');
    const panelContent = document.getElementById('panelContent');
    const menuButtons = [...document.querySelectorAll('.menu-button')];
    const panelMarkup = {
      items: () => `<h2>🎒 Itens</h2><p>${items.map(item => `🎁 ${item}`).join('<br>')}</p><p>💎 Cristais da missão: ${crystals}</p>`,
      status: () => `<h2>🛡️ Status</h2><p>Nível: ${player.level}</p><p>Vida: ${player.hp} / ${player.maxHp}</p><p>Ataque: ${player.attack}</p><p>Experiência: ${player.xp} / 40</p>`,
      options: () => `<h2>⚙️ Opções</h2><p>Movimento: WASD ou setas</p><p>Ataque: Espaço • Interagir: E</p><p class="muted">Dica: pressione Esc para fechar este painel.</p>`,
      talents: () => `<h2>✨ Talentos</h2><p>⭐ Nível do aventureiro: ${player.level}</p><p>⚔️ Poder de ataque: ${player.attack}</p><p class="muted">Derrote inimigos para ganhar experiência e subir de nível.</p>`
    };
    function closePanel() { menuPanel.hidden = true; menuButtons.forEach(button => button.setAttribute('aria-expanded', 'false')); }
    menuButtons.forEach(button => button.addEventListener('click', () => {
      if (!menuPanel.hidden && button.getAttribute('aria-expanded') === 'true') { closePanel(); return; }
      menuButtons.forEach(item => item.setAttribute('aria-expanded', 'false'));
      button.setAttribute('aria-expanded', 'true');
      panelContent.innerHTML = panelMarkup[button.dataset.panel]();
      menuPanel.hidden = false;
    }));
    document.querySelector('.panel-close').addEventListener('click', closePanel);
    document.addEventListener('keydown', event => {
      if (event.code === 'Escape') closePanel();
      if (event.code === 'Space') { event.preventDefault(); attack(); }
      if (event.code === 'KeyE') interact();
      keys[event.code] = true;
    });
    document.addEventListener('keyup', event => { keys[event.code] = false; });

    draw();
    requestAnimationFrame(update);
  </script>
</body>
</html>
